name: Validate required Secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets are present
        env:
          S1: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          S2: ${{ secrets.SIGNING_KEY_ALIAS }}
          S3: ${{ secrets.SIGNING_KEY_PASSWORD }}
          S4: ${{ secrets.KEYSTORE_PASSWORD }}
          S5: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          [ -z "${S1}" ] && missing+=(SIGNING_KEYSTORE_BASE64)
          [ -z "${S2}" ] && missing+=(SIGNING_KEY_ALIAS)
          [ -z "${S3}" ] && missing+=(SIGNING_KEY_PASSWORD)
          [ -z "${S4}" ] && missing+=(KEYSTORE_PASSWORD)
          [ -z "${S5}" ] && missing+=(PLAY_SERVICE_ACCOUNT_JSON)

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required secrets:"
            for m in "${missing[@]}"; do echo "- $m"; done
            exit 1
          else
            echo "All required secrets are present."
          fi
